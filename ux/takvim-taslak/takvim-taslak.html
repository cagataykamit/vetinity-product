<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takvim taslağı</title>
<!--
  Randevu takvimi yeniden tasarım taslağı (2026-11-18). Statik; veriler uydurmadır (gerçek hasta/sahip adı yok).
  Görünüm adres çubuğundaki # ile seçilir: #hafta, #hafta-asi, #gun, #ay, #renkler. ?dark koyu tema.
  Açıklama: ../takvim-yeniden-tasarim.md
-->
<style>
:root {
  --bg: #f4f6f7; --surface: #ffffff; --surface-2: #f8fafa; --border: #e2e6e8; --line: #edf0f1; --line-strong: #dfe4e6;
  --text: #182226; --muted: #637078; --faint: #98a3a9;
  --primary: #0f766e; --primary-soft: #e7f3f1; --primary-text: #ffffff;
  --st-upcoming: #1f2a30; --st-today: #e0a800; --st-overdue: #d92d20; --st-done: #16a34a;
  --soft-today: #fff8db; --soft-overdue: #fdf0ee; --soft-done: #f1f8f3;
  --hatch: rgba(120, 135, 140, .13); --shadow: 0 10px 30px rgba(16, 32, 40, .14);
  --chip: #eef1f2; --now: #0f766e;
}
html.dark {
  --bg: #0f1518; --surface: #161e22; --surface-2: #1a2327; --border: #2a353a; --line: #1f292d; --line-strong: #2a353a;
  --text: #e8eef0; --muted: #9aa7ad; --faint: #6c7a80;
  --primary: #2bb3a3; --primary-soft: #12302d; --primary-text: #08201d;
  --st-upcoming: #e8eef0; --st-today: #f5c518; --st-overdue: #f2665a; --st-done: #3ccf73;
  --soft-today: #2e2a12; --soft-overdue: #3a1d1b; --soft-done: #15301f;
  --hatch: rgba(160, 175, 180, .10); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --chip: #253035; --now: #2bb3a3;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", Inter, system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }

/* Panel çerçevesi (sadeleştirilmiş) */
.top { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
.logo { font-weight: 700; font-size: 19px; letter-spacing: .2px; color: var(--text); width: 160px; }
.logo b { color: var(--primary); }
.search { margin-left: auto; width: 190px; height: 28px; border: 1px solid var(--border); border-radius: 6px; color: var(--faint); padding: 5px 10px; font-size: 12px; }
.clinic { font-weight: 600; font-size: 12px; color: var(--muted); }
.shell { display: flex; height: calc(100% - 46px); }
.side { width: 190px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 14px 0; }
.side h6 { margin: 12px 18px 6px; font-size: 10.5px; letter-spacing: .6px; color: var(--muted); }
.side a { display: block; padding: 7px 18px; color: var(--text); text-decoration: none; font-size: 13px; }
.side a.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { flex: 1; min-width: 0; padding: 8px 20px 10px; display: flex; flex-direction: column; }

.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); height: 34px; align-items: flex-end; flex: none; }
.tabs span { padding-bottom: 8px; color: var(--muted); }
.tabs span.on { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); }
.tabs i { font-style: normal; background: var(--st-overdue); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }

.bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex: none; }
.bar + .bar { margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg span { padding: 4px 11px; font-size: 12.5px; }
.seg span + span { border-left: 1px solid var(--border); }
.seg span.on { background: var(--primary); color: var(--primary-text); font-weight: 600; }
.nav { display: inline-flex; align-items: center; gap: 4px; }
.nav .ib { width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 6px; display: grid; place-items: center; background: var(--surface); color: var(--muted); }
.nav .tb { height: 26px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; background: var(--surface); font-size: 12.5px; }
.range { font-size: 16px; font-weight: 600; margin-left: 4px; }
.range small { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 8px; }
.sp { flex: 1; }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.sel { height: 28px; min-width: 150px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 4px 10px; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; }
.sel em { font-style: normal; color: var(--muted); font-size: 11px; }
.flabel { font-size: 11.5px; color: var(--muted); }
.chip { height: 26px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 0 10px 0 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.chip .bar4 { width: 4px; height: 13px; border-radius: 2px; }
.mini-seg span { padding: 3px 9px; font-size: 12px; }

/* Takvim kartı */
.cal { position: relative; flex: 1; min-height: 0; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; }
.calmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ghead, .gbody { display: grid; }
.ghead { border-bottom: 1px solid var(--line-strong); flex: none; }
.gbody { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.tcol { position: relative; border-right: 1px solid var(--line); }
.tlabel { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.tlabel.now { color: var(--now); font-weight: 700; background: var(--surface); padding: 0 2px; }
.dh { padding: 6px 8px 7px; border-left: 1px solid var(--line); min-width: 0; }
.dh.today { background: var(--primary-soft); }
.dh1 { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.dh1 .num { font-size: 18px; font-weight: 700; line-height: 20px; }
.dh.today .num { background: var(--primary); color: var(--primary-text); border-radius: 5px; padding: 0 5px; }
.dh.narrow { padding: 6px 5px 7px; }
.dh.narrow .dn { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.dh1 .dn { font-weight: 600; }
.dh1 .cnt { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.badge { font-size: 10px; background: var(--primary); color: var(--primary-text); border-radius: 4px; padding: 0 5px; font-weight: 600; align-self: center; }
.vx { margin-top: 5px; height: 22px; width: 100%; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); display: flex; align-items: center; gap: 5px; padding: 0 7px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.vx svg { flex: none; }
.vx b { color: var(--text); font-weight: 600; }
.vx .od { color: var(--st-overdue); font-weight: 600; }
.vx .chev { margin-left: auto; color: var(--faint); }
.vx.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); color: var(--text); }
.vhead { padding: 6px 10px 7px; border-left: 1px solid var(--line); }
.vhead .vn { font-weight: 600; font-size: 13.5px; }
.vhead .vs { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

.col { position: relative; border-left: 1px solid var(--line); }
.col.today { background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-strong); }
.hl.half { border-top: 1px dashed var(--line); }
.hatch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--hatch) 6px 8px); }
.closed-label { position: absolute; top: 10px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 11.5px; }
.narrow .closed-label { writing-mode: vertical-rl; transform: rotate(180deg); top: 12px; left: 50%; right: auto; margin-left: -8px; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 2; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }

/* Randevu kartı: renk = durum (sol şerit + simge); hekim = baş harf rozeti */
.ap { position: absolute; z-index: 3; padding: 1px 2px; }
.card { height: 100%; border-radius: 5px; border: 1px solid var(--border); border-left: 4px solid var(--st-upcoming); background: var(--surface); padding: 2px 6px 2px 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 32, 40, .06); display: flex; flex-direction: column; justify-content: center; }
.card .l1, .card .l2, .card .l3 { display: flex; align-items: center; gap: 5px; white-space: nowrap; min-width: 0; }
.card .l2, .card .l3 { margin-top: 1px; }
.card .t { font-weight: 700; flex: none; }
.card .p { font-weight: 600; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.card .o { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 0 100 auto; min-width: 0; }
.card .l3 { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.card .vet { margin-left: auto; flex: none; font-size: 10px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 3px; padding: 0 4px; line-height: 15px; }
.card .vet.none { background: none; border: 1px dashed var(--faint); }
.card .ico { flex: none; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; }
.card.s-today { border-left-color: var(--st-today); }
.card.s-overdue { border-left-color: var(--st-overdue); background: var(--soft-overdue); }
.card.s-overdue .t { color: var(--st-overdue); }
.card.s-overdue .ico { background: var(--st-overdue); }
.card.s-done { border-left-color: var(--st-done); background: var(--surface-2); }
.card.s-done .p, .card.s-done .t { color: var(--muted); font-weight: 600; }
.card.s-done .ico { background: var(--st-done); }
.card.s-noshow { border-left-color: var(--faint); background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--hatch) 6px 8px); }
.card.s-noshow .t, .card.s-noshow .p { text-decoration: line-through; color: var(--muted); }
.card.s-noshow .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; flex: none; }
.card.conflict { box-shadow: 0 0 0 1.5px var(--st-overdue); }
.card.s-live { box-shadow: 0 0 0 1.5px var(--st-today), 0 1px 2px rgba(16, 32, 40, .06); }

/* Sağ panel (hafta: tıklayınca açılır, gün: açık) */
.rail { width: 330px; flex: none; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 352px; z-index: 20; box-shadow: var(--shadow); border-left: 1px solid var(--border); }
.rh { padding: 10px 14px 8px; border-bottom: 1px solid var(--line-strong); }
.rh1 { display: flex; align-items: center; gap: 8px; }
.rh1 h3 { margin: 0; font-size: 14.5px; }
.rh1 .x { margin-left: auto; color: var(--muted); font-size: 18px; line-height: 1; }
.rh .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.rtabs { display: flex; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--line-strong); }
.rtabs span { padding: 8px 0 7px; color: var(--muted); font-size: 12.5px; }
.rtabs span.on { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); }
.rtabs span i { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 3px; }
.rseg { padding: 8px 14px 6px; }
.rlist { flex: 1; min-height: 0; overflow: hidden; }
.grp { padding: 7px 14px 3px; font-size: 11px; font-weight: 700; letter-spacing: .4px; color: var(--muted); text-transform: uppercase; }
.vrow { display: flex; gap: 9px; padding: 6px 14px 7px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.vrow .bar4 { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.vrow .vt { flex: 1; min-width: 0; }
.vrow .v1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .v1 b { font-weight: 600; }
.vrow .v1 span { color: var(--muted); }
.vrow .v2 { color: var(--text); font-size: 12px; margin-top: 1px; }
.vrow .v3 { margin-top: 3px; display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--primary); background: var(--primary-soft); border-radius: 3px; padding: 0 5px; }
.vrow .va { flex: none; display: flex; gap: 4px; align-items: center; }
.vrow .sb { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 11.5px; font-weight: 600; background: var(--surface); }
.vrow .km { width: 24px; height: 24px; border-radius: 5px; color: var(--muted); font-size: 15px; line-height: 1; }
.vrow.done .v1 b, .vrow.done .v2 { color: var(--muted); }
.vrow.done .when { font-size: 11px; color: var(--st-done); font-weight: 600; }
.rfoot { padding: 9px 14px; border-top: 1px solid var(--line-strong); font-size: 12px; color: var(--primary); font-weight: 600; display: flex; justify-content: space-between; }
.rfoot span { color: var(--muted); font-weight: 400; }

/* Ay */
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; min-height: 0; }
.mwk { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line-strong); flex: none; }
.mwk div { padding: 6px 8px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.mc { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 7px 5px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.mc:nth-child(7n) { border-right: 0; }
.mc.out { background: var(--surface-2); }
.mc.out .mn, .mc.out .ml { opacity: .45; }
.mc.today { background: var(--primary-soft); }
.mh { display: flex; align-items: center; gap: 6px; }
.mn { font-weight: 700; font-size: 13px; width: 22px; height: 20px; display: grid; place-items: center; border-radius: 10px; }
.mc.today .mn { background: var(--primary); color: var(--primary-text); }
.mh .mcnt { margin-left: auto; font-size: 11px; color: var(--muted); }
.ml { display: flex; gap: 5px; align-items: center; font-size: 11.5px; white-space: nowrap; overflow: hidden; margin-top: 1px; }
.ml .bar4 { width: 3px; height: 11px; border-radius: 2px; flex: none; }
.ml b { font-weight: 600; }
.ml.more { color: var(--primary); font-weight: 600; padding-left: 8px; }
.mv { margin-top: auto; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.mv .od { color: var(--st-overdue); font-weight: 600; }
.mc.closed .mh .mcnt { font-style: italic; }

/* Renk sayfası */
.sheet { flex: 1; overflow: hidden; padding: 14px 4px; display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 20px; }
.sheet h4 { margin: 0 0 4px; font-size: 13.5px; }
.sheet p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.demo { position: relative; height: 54px; margin-bottom: 8px; }
.demo.s1 { height: 28px; }
.demo .ap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; padding: 0; }
.cap { font-size: 11.5px; color: var(--muted); margin: -4px 0 10px; }
.oldchip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid; border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; margin: 0 4px 6px 0; }
.box { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--surface); }
.no { color: var(--st-overdue); font-weight: 700; }
.ok { color: var(--st-done); font-weight: 700; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">Vet<b>inity</b></div>
  <div class="search">Ara…  Ctrl K</div>
  <div class="clinic">ÖRNEK KLİNİK</div>
</header>
<div class="shell">
  <nav class="side">
    <h6>GÜNLÜK İŞ</h6><a>Bugün</a><a class="on">Randevular</a>
    <h6>MÜŞTERİ VE HASTA</h6><a>Müşteri ve hasta</a>
    <h6>KLİNİK</h6><a>Kayıtlar</a>
    <h6>PARA VE STOK</h6><a>Para</a><a>Stok</a>
  </nav>
  <main id="main"></main>
</div>
<script>
const SHIELD = '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 2.5 3.3v4.2c0 3.4 2.3 6.1 5.5 7.3 3.2-1.2 5.5-3.9 5.5-7.3V3.3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const H = (h, m = 0) => h * 60 + m;

const NOW = H(14, 20);
const VETS = { EA: 'Dr. Ece Arslan', MK: 'Dr. Murat Kaya' };
const ST = { up: 's-up', today: 's-today', overdue: 's-overdue', done: 's-done', noshow: 's-noshow' };
const STATE_COLOR = { up: 'var(--st-upcoming)', today: 'var(--st-today)', overdue: 'var(--st-overdue)', done: 'var(--st-done)' };

// a(saat, dakika, süre, hasta, sahip, hekim, tür, durum)

const DAYS = [
  { num: 16, name: 'Pazartesi', open: [H(9), H(18)], vx: { total: 13, overdue: 3 }, appts: [

    a(10, 15, 45, 'Tarçın', 'Kerem Öztürk', 'MK', 'Muayene', 'done'),

  { num: 17, name: 'Salı', open: [H(9), H(18)], vx: { total: 8, overdue: 2 }, appts: [
    a(9, 0, 30, 'Limon', 'Burak Çelik', 'EA', 'Aşı', 'done'),
    a(9, 0, 30, 'Maya', 'Gizem Tekin', 'MK', 'Muayene', 'done'),
    a(11, 30, 30, 'Fırtına', 'Okan Polat', 'MK', 'Kontrol', 'done'),

  { num: 18, name: 'Çarşamba', today: true, open: [H(9), H(18)], vx: { total: 17, overdue: 0 }, appts: [
    a(9, 0, 30, 'Karamel', 'Emre Aksoy', 'EA', 'Aşı', 'done'),
    a(9, 30, 30, 'Kurabiye', 'Sevgi Arslan', 'MK', 'Kontrol', 'done'),
    a(10, 30, 45, 'Odin', 'Tolga Kılıç', 'EA', 'Muayene', 'done'),
    a(11, 30, 30, 'Leo', 'Merve Can', 'MK', 'Aşı', 'done'),
    a(12, 30, 30, 'Kuki', 'Barış Öz', 'EA', 'Kontrol', 'today'),
    a(14, 0, 60, 'Cesur', 'Ahmet Güneş', 'MK', 'Diş taşı temizliği', 'today'),
    a(14, 0, 30, 'Minnoş', 'Zeynep Aras', 'EA', 'Aşı', 'today'),
    a(15, 30, 30, 'Sansa', 'Fatma Uçar', 'EA', 'Kontrol', 'today'),
    a(16, 0, 30, 'Garfield', 'Ali Rıza Er', 'MK', 'Muayene', 'today'),
    a(17, 0, 45, 'Pati', 'Ceren Ay', 'EA', 'Muayene', 'today')] },
  { num: 19, name: 'Perşembe', open: [H(9), H(18)], vx: { total: 15, overdue: 0 }, appts: [
    a(9, 30, 30, 'Karabaş', 'Ozan Bilgin', 'EA', 'Kontrol', 'up'),
    a(10, 0, 60, 'Lokum', 'İrem Sarı', 'MK', 'Kısırlaştırma', 'up'),
    a(13, 30, 30, 'Mavi', 'Kaan Ateş', 'EA', 'Aşı', 'up'),
    a(16, 30, 30, 'Pırtık', 'Esra Tuna', 'MK', 'Kontrol', 'up')] },
  { num: 20, name: 'Cuma', open: [H(9), H(18)], vx: { total: 14, overdue: 0 }, appts: [
    a(9, 0, 30, 'Pofuduk', 'Seda Ekinci', 'EA', 'Aşı', 'up'),

/** Çakışan kartları yan yana şeritlere böler. */
function layout(appts) {
  const list = [...appts].sort((x, y) => x.s - y.s || y.e - x.e);
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(...cluster.map((c) => c.lane)) + 1; cluster.forEach((c) => (c.lanes = n)); cluster = []; };
  for (const it of list) {
    if (it.s >= end && cluster.length) flush();
    const used = cluster.filter((c) => c.e > it.s).map((c) => c.lane);
    let lane = 0; while (used.includes(lane)) lane++;
    it.lane = lane; cluster.push(it); end = Math.max(end, it.e);
  }
  if (cluster.length) flush();
  return list;
}

const shortName = (n) => { const p = n.split(' '); return p.length > 1 ? p[0][0] + '. ' + p.slice(1).join(' ') : n; };

function cardHtml(it, h, opts) {
  const cls = 'card ' + ST[it.st] + (it.live ? ' s-live' : '');
  const ico = it.st === 'overdue' ? '<span class="ico" title="Gecikmiş">!</span>' : it.st === 'done' ? '<span class="ico" title="Tamamlandı">✓</span>' : '';
  const tag = it.st === 'noshow' ? '<span class="tag">Gelmedi</span>' : '';
  const vet = opts.showVet && !(it.lanes > 1 && opts.narrowLanes) ? (it.vet ? `<span class="vet" title="${VETS[it.vet]}">${it.vet}</span>` : '<span class="vet none" title="Hekim seçilmedi">–</span>') : '';
  const narrow = it.lanes > 1 && opts.narrowLanes;
  const range = `${clock(it.s)}–${clock(it.e)}`;
  if (h >= 40) {
    const l3 = h >= 56 ? `<div class="l3">${it.type}${opts.showVet && it.vet ? ' · ' + VETS[it.vet] : ''}</div>` : '';
    return `<div class="${cls}"><div class="l1">${ico}<span class="t tnum">${narrow ? clock(it.s) : range}</span>${tag}${vet}</div>
      <div class="l2"><span class="p">${it.pet}</span>${narrow ? '' : `<span class="o">· ${opts.wide ? it.owner + ' · ' + it.type : shortName(it.owner)}</span>`}</div>${opts.wide ? '' : l3}</div>`;
  }
  const extra = opts.wide ? `<span class="o">· ${it.owner}</span><span class="o">· ${it.type}</span>` : narrow ? '' : `<span class="o">· ${shortName(it.owner)}</span>`;
  return `<div class="${cls}"><div class="l1">${ico}<span class="t tnum">${opts.wide ? range : clock(it.s)}</span>${tag}<span class="p">${it.pet}</span>${extra}${vet}</div></div>`;
}

/** Saat ızgarası: sütun = gün (hafta) ya da hekim (gün). Ölçek, mesai saatleri ekrana sığacak şekilde hesaplanır. */
function grid(host, cols, opts) {
  const template = '46px ' + cols.map((c) => (c.narrow ? '58px' : 'minmax(0,1fr)')).join(' ');
  const opens = cols.filter((c) => c.open).flatMap((c) => c.open);
  const ap = cols.flatMap((c) => c.appts);
  let start = Math.min(...opens, ...ap.map((x) => x.s)); let end = Math.max(...opens, ...ap.map((x) => x.e));
  start = Math.floor(start / 60) * 60; end = Math.ceil(end / 60) * 60;
  host.innerHTML = `<div class="ghead" style="grid-template-columns:${template}"><div></div>${cols.map((c) => c.head).join('')}</div>
    <div class="gbody" style="grid-template-columns:${template}"><div class="tcol"></div>${cols.map(() => '<div class="col"></div>').join('')}</div>`;
  const body = host.querySelector('.gbody');
  const ppm = Math.max(0.8, Math.min(1.6, (body.clientHeight - 6) / (end - start)));
  const y = (m) => (m - start) * ppm + 4;
  const tcol = body.querySelector('.tcol');
  for (let m = start + 60; m < end; m += 60) tcol.insertAdjacentHTML('beforeend', `<div class="tlabel tnum" style="top:${y(m)}px">${clock(m)}</div>`);
  tcol.insertAdjacentHTML('beforeend', `<div class="tlabel tnum" style="top:${y(start) + 6}px">${clock(start)}</div>`);
  if (opts.now !== undefined) tcol.insertAdjacentHTML('beforeend', `<div class="tlabel tnum now" style="top:${y(opts.now)}px">${clock(opts.now)}</div>`);
  body.querySelectorAll('.col').forEach((el, i) => {
    const c = cols[i];
    if (c.today) el.classList.add('today');
    if (c.narrow) el.classList.add('narrow');
    let html = '';
    for (let m = start; m < end; m += 30) html += `<div class="hl ${m % 60 ? 'half' : ''}" style="top:${y(m)}px"></div>`;
    if (!c.open) html += `<div class="hatch" style="top:${y(start)}px;height:${y(end) - y(start)}px"></div><div class="closed-label">Kapalı</div>`;
    else {
      if (c.open[0] > start) html += `<div class="hatch" style="top:${y(start)}px;height:${y(c.open[0]) - y(start)}px"></div>`;
      if (c.open[1] < end) html += `<div class="hatch" style="top:${y(c.open[1])}px;height:${y(end) - y(c.open[1])}px"></div>`;
    }
    for (const it of layout(c.appts)) {
      const h = (it.e - it.s) * ppm;
      html += `<div class="ap" style="top:${y(it.s)}px;height:${h}px;left:${(it.lane / it.lanes) * 100}%;width:${100 / it.lanes}%">${cardHtml(it, h - 2, opts)}</div>`;
    }
    if (c.today && opts.now !== undefined) html += `<div class="nowline" style="top:${y(opts.now) - 1}px"></div>`;
    el.innerHTML = html;
  });
  return { ppm, start, end };
}

function vxPill(vx, active, narrow) {

}

function renderMonth() {
  main.innerHTML = toolbar('ay') + `<section class="cal"><div class="calmain" id="cm"></div></section>`;
  const names = ['Zeytin', 'Tarçın', 'Pamuk', 'Boncuk', 'Limon', 'Maya', 'Fırtına', 'Şans', 'Bal', 'Reis', 'Karamel', 'Leo', 'Kuki', 'Cesur', 'Karabaş', 'Lokum', 'Mavi', 'Rocky', 'Tekir', 'Tarzan'];
  const cells = [];
  const first = new Date(2026, 9, 26);
  for (let i = 0; i < 42; i++) {
    const dt = new Date(first); dt.setDate(first.getDate() + i);
    const dn = dt.getDate(), mon = dt.getMonth(), dow = i % 7;
    const out = mon !== 10;
    const wk = DAYS.find((x) => x.num === dn && mon === 10);
    const seed = (dn * 7 + mon * 3) % 11;
    let appts, vx;
    if (wk) { appts = wk.appts.map((x) => ({ s: x.s, pet: x.pet, st: x.st })); vx = wk.vx; }
    else {
      const n = dow === 6 ? 0 : dow === 5 ? 2 + (seed % 2) : 3 + (seed % 6);
      const past = mon < 10 || (mon === 10 && dn < 18);
      appts = Array.from({ length: n }, (_, k) => ({ s: H(9 + k, k % 2 ? 30 : 0), pet: names[(dn + k * 3) % names.length], st: past ? (k === 2 && seed % 3 === 0 ? 'overdue' : 'done') : 'up' }));
      const total = dow === 6 ? 2 + (seed % 3) : 6 + ((seed * 5) % 13);
      vx = { total, overdue: past ? seed % 4 : 0 };
    }
    const shown = appts.slice(0, 2).map((x) => `<div class="ml"><span class="bar4" style="background:${x.st === 'noshow' ? 'var(--faint)' : STATE_COLOR[x.st]}"></span><b class="tnum">${clock(x.s)}</b>${x.pet}</div>`).join('');
    const more = appts.length > 2 ? `<div class="ml more">+${appts.length - 2} randevu</div>` : '';
    const od = appts.filter((x) => x.st === 'overdue').length;
    cells.push(`<div class="mc ${out ? 'out' : ''} ${mon === 10 && dn === 18 ? 'today' : ''} ${dow === 6 ? 'closed' : ''}">
      <div class="mh"><span class="mn">${dn}</span><span class="mcnt">${dow === 6 ? 'kapalı' : appts.length ? appts.length + ' randevu' + (od ? ` · <span style="color:var(--st-overdue);font-weight:600">${od} gecikmiş</span>` : '') : ''}</span></div>
      ${shown}${more}
      <div class="mv">${SHIELD}${vx.total} aşı${vx.overdue ? `<span class="od">· ${vx.overdue} gecikmiş</span>` : ''}</div></div>`);
  }
  document.getElementById('cm').innerHTML = `<div class="mwk">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map((x) => `<div>${x}</div>`).join('')}</div><div class="mgrid" style="grid-template-rows:repeat(6,1fr)">${cells.join('')}</div>`;
}
