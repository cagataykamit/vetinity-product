<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takvim taslağı 3</title>
<!--
  Randevu takvimi 3. tur (2026-11-18). Kullanıcının beğendiği örneklerden fikir alındı, görünüm kopyalanmadı:
  9 (klinik programı: günün özeti, hekim sütunları, klinikte bekleyenler, boş saatler), 3 (Digitail: hafta/ay hücresinde
  küçük kartlar ve "+N daha", geçmiş soluk), 15 (büyük okunur ad, saat üstte, havadar beyaz kart, süren randevu koyu).
  Veriler uydurmadır. Görünüm: #gun (varsayılan), #hafta, #ay. Sağ üstten açık/koyu tema.
-->
<style>
:root {
  --bg: #f3f5f6; --surface: #ffffff; --surface-2: #f7f9f9; --border: #e3e7e9; --line: #eef1f2; --dot: #d9dfe2;
  --text: #16211f; --muted: #5f6c72; --faint: #97a2a8;
  --primary: #0f766e; --primary-2: #115e59; --primary-soft: #e6f3f1; --on-primary: #ffffff;
  --up: #27343a; --today: #d99a00; --today-soft: #fff7e0; --overdue: #d92d20; --overdue-soft: #fdeeec; --done: #16a34a;
  --shadow: 0 1px 2px rgba(16, 32, 40, .06), 0 2px 8px rgba(16, 32, 40, .05); --shadow-lg: 0 12px 32px rgba(16, 32, 40, .16);
}
html.dark {
  --bg: #0e1416; --surface: #161e21; --surface-2: #1a2427; --border: #29353a; --line: #1e282b; --dot: #2a363b;
  --text: #e9efef; --muted: #9ba8ad; --faint: #6b797e;
  --primary: #2bb3a3; --primary-2: #1f8f83; --primary-soft: #133330; --on-primary: #06201c;
  --up: #d5dde0; --today: #f2c230; --today-soft: #2f2a14; --overdue: #f2665a; --overdue-soft: #3a1d1b; --done: #3ccf73;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", Inter, system-ui, sans-serif; overflow: hidden; }
a { color: inherit; text-decoration: none; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }

.top { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
.logo { font-weight: 700; font-size: 19px; width: 160px; } .logo b { color: var(--primary); }
.search { margin-left: auto; width: 220px; height: 30px; border: 1px solid var(--border); border-radius: 8px; color: var(--faint); padding: 6px 10px; font-size: 12.5px; }
.top .theme { font-size: 12.5px; color: var(--primary); font-weight: 600; }
.clinic { font-weight: 600; font-size: 12px; color: var(--muted); }
.shell { display: flex; height: calc(100% - 46px); }
.side { width: 190px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 14px 0; }
.side h6 { margin: 12px 18px 6px; font-size: 10.5px; letter-spacing: .6px; color: var(--muted); }
.side a { display: block; padding: 7px 18px; font-size: 13.5px; }
.side a.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { flex: 1; min-width: 0; padding: 10px 20px 12px; display: flex; flex-direction: column; gap: 10px; }

/* Seçenek şeridi (taslağın parçası, ürünün değil) */
.draft { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px dashed var(--primary); border-radius: 10px; background: var(--primary-soft); flex: none; font-size: 13px; }
.draft b { margin-right: 4px; }
.draft a { padding: 4px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.draft a small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.draft a.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.draft a.on small { color: var(--on-primary); opacity: .85; }
/* Durum rengi tek değişkende: --c (nokta, şerit), --soft (seçenek 3 dolgusu) */
.card, .mini, .chip, .ar { --c: var(--up); --soft: var(--surface-2); }
.today, .wait { --c: var(--today); --soft: var(--today-soft); }
.overdue { --c: var(--overdue); --soft: var(--overdue-soft); }
.done { --c: var(--done); --soft: color-mix(in srgb, var(--done) 10%, var(--surface)); }
.room { --c: var(--primary); }
.noshow { --c: var(--faint); }

/* Seçenek 2: ferah kartlar (15) — çerçevesiz yüzen kart, renk noktada, büyük ad, noktalı çizgiler */
.v2 .hl { border-top: 1px dotted var(--dot); }
.v2 .hl.q { border-top-color: transparent; }
.v2 .col { border-left: 0; }
.v2 .ph { border-left: 0; margin: 8px 6px; padding: 4px 16px 4px 4px; border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow); }
.v2 .dhead { border-bottom: 0; }
.v2 .cd { padding: 3px 6px; }
.v2 .card { border: 0; border-radius: 12px; padding: 7px 12px; box-shadow: 0 1px 2px rgba(16, 32, 40, .05), 0 6px 18px rgba(16, 32, 40, .08); }
.v2 .card .t::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.v2 .card .nm { font-size: 16px; }
.v2 .card.done { opacity: .6; box-shadow: none; background: var(--surface-2); }
.v2 .card.overdue { background: var(--surface); }
.v2 .card.room { background: var(--primary); }
.v2 .card.room .t::before { background: var(--on-primary); }
.v2 .cal { border: 0; background: transparent; }
.v2 .calbar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; }
.v2 .mini { border: 0; border-radius: 10px; padding: 7px 10px; box-shadow: 0 1px 2px rgba(16, 32, 40, .05), 0 4px 12px rgba(16, 32, 40, .07); }
.v2 .mini .t::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; align-self: center; }
.v2 .mini .nm { font-size: 15px; }
.v2 .wk, .v2 .mg, .v2 .mwk { background: var(--surface); border-radius: 12px; }
.v2 .wd { border-left-color: transparent; }
.v2 .chip { background: var(--surface); border-left: 0; box-shadow: var(--shadow); }
.v2 .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.pillbtn { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pillbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--today); }

/* Seçenek 3: ajanda + takvim (3) — solda ay ve bugünün listesi, kart dolgusu durum renginde */
.v3 .card { border: 0; background: var(--soft); box-shadow: none; border-radius: 8px; }
.v3 .card .t::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); flex: none; box-sizing: border-box; }
.v3 .card.done .t::before { background: var(--c); }
.v3 .card.room { background: var(--primary); }
.v3 .card.room .t::before { border-color: var(--on-primary); }
.v3 .mini { border: 0; background: var(--soft); box-shadow: none; }
.v3 .mini.done { opacity: .55; }
.v3 .chip { border-left: 0; background: var(--soft); }
.lrail { width: 270px; flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.mcal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; flex: none; }
.mcal .hd { display: flex; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.mcal .hd span { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: 6px; }
.mcal .g { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; row-gap: 2px; }
.mcal .g .w { color: var(--muted); font-size: 11px; font-weight: 600; }
.mcal .g a { height: 26px; display: grid; place-items: center; border-radius: 13px; position: relative; }
.mcal .g a.o { color: var(--faint); }
.mcal .g a.t { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.mcal .g a.wkd { background: var(--primary-soft); }
.mcal .g a i { position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--overdue); }
.agenda { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 10px 6px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.agenda h3 { margin: 0 4px 2px; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
.agenda h3 small { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
.agenda .seg2 { display: flex; gap: 4px; margin: 6px 4px 6px; }
.agenda .seg2 a { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); }
.agenda .seg2 a.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.alist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.ar { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; border-radius: 8px; padding: 5px 8px; background: var(--soft); }
.ar b.tm { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ar .x { min-width: 0; }
.ar .x div { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar .x small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar.room { background: var(--primary); color: var(--on-primary); }
.ar.room .x small { color: var(--on-primary); opacity: .85; }
.ar.done { opacity: .55; }
.agrp { font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin: 4px 4px 0; }
.anow { display: flex; align-items: center; gap: 6px; color: var(--primary); font-size: 11px; font-weight: 700; }
.anow::after { content: ""; flex: 1; height: 2px; background: var(--primary); }

/* Çok hekim: tek kaydırma alanı; başlık üstte, saat solda sabit */
.dwrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
.dwrap .dhead { position: sticky; top: 0; z-index: 8; background: var(--surface); }
.dwrap .dhead > div:first-child { position: sticky; left: 0; z-index: 9; background: var(--surface); }
.dwrap .tcol { position: sticky; left: 0; z-index: 7; background: var(--surface); border-right: 1px solid var(--line); }
.v2 .dwrap .dhead { background: var(--bg); }
.vetbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: nowrap; overflow-x: auto; font-size: 12.5px; }
.vetbar > span { color: var(--muted); white-space: nowrap; }
.vchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 3px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); white-space: nowrap; font-weight: 600; }
.vchip .av { width: 22px; height: 22px; font-size: 10px; }
.vchip.off { opacity: .45; font-weight: 400; }
.vchip small { color: var(--muted); font-weight: 400; }
.vchip.me { border-color: var(--primary); color: var(--primary); padding: 0 10px; }
.vlink { color: var(--primary); font-weight: 600; white-space: nowrap; }
.demo { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; border: 1px dashed var(--primary); border-radius: 8px; padding: 2px 6px; background: var(--primary-soft); white-space: nowrap; }
.demo a { padding: 1px 7px; border-radius: 5px; font-weight: 600; }
.demo a.on { background: var(--primary); color: var(--on-primary); }
.av.c2 { background: #7c5cc4; } .av.c3 { background: #c2410c; } .av.c4 { background: #0369a1; } .av.c5 { background: #be185d; } .av.c6 { background: #4d7c0f; } .av.c7 { background: #6b7280; }

/* Başlık satırı */
.head { display: flex; align-items: center; gap: 14px; flex: none; }
.head h1 { margin: 0; font-size: 20px; }
.tabs { display: flex; gap: 4px; }
.tabs a { padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.tabs a.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.tabs i { font-style: normal; background: var(--overdue); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
.sp { flex: 1; }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* Günün özeti (9'dan fikir) */
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; flex: none; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.kpi .bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--faint); }
.kpi b { font-size: 22px; line-height: 1; }
.kpi .l { min-width: 0; }
.kpi .l div { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .l small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Ana alan */
.body { flex: 1; min-height: 0; display: flex; gap: 12px; }
.cal { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.calbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
.nav a { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); }
.date { font-size: 16.5px; font-weight: 700; margin-left: 4px; }
.today-chip { font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 6px; padding: 2px 8px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg a { padding: 4px 12px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg a.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.filter { height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-right: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 3px; height: 12px; border-radius: 2px; }

/* Gün: hekim sütunları */
.dhead { display: grid; border-bottom: 1px solid var(--line); flex: none; }
.ph { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-width: 0; border-left: 1px solid var(--line); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--on-primary); background: var(--primary); flex: none; }
.av.vx { background: var(--today); color: #2a2000; }
.ph .n { font-weight: 600; font-size: 14px; white-space: nowrap; }
.ph > div { min-width: 0; overflow: hidden; }
.ph .n { overflow: hidden; text-overflow: ellipsis; }
.ph small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph small b { color: var(--text); font-weight: 600; }
.dscroll { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.dgrid { display: grid; position: relative; }
.tcol { position: relative; }
.tl { position: absolute; right: 8px; font-size: 11.5px; color: var(--muted); transform: translateY(-50%); }
.col { position: relative; border-left: 1px solid var(--line); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.hl.q { border-top: 1px dotted var(--dot); }
.closed { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--faint) 14%, transparent) 6px 8px); }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--primary); z-index: 2; pointer-events: none; }
.nowpill { position: absolute; left: 4px; z-index: 5; transform: translateY(-50%); background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; }

/* Kart (15'ten fikir: saat üstte küçük, ad büyük; beyaz, havadar) */
.cd { position: absolute; z-index: 3; padding: 2px 4px; }
.card { height: 100%; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--up); border-radius: 8px; box-shadow: var(--shadow); padding: 4px 9px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; }
.card .t { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.card .t b { color: var(--text); font-weight: 600; }
.card .nm { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.card .nm span { font-weight: 400; font-size: 13px; color: var(--muted); }
.card .ty { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; flex: none; }
.card.today { border-left-color: var(--today); }
.card.overdue { border-left-color: var(--overdue); background: var(--overdue-soft); }
.card.overdue .st { background: var(--overdue); color: #fff; }
.card.done { border-left-color: var(--done); background: var(--surface-2); box-shadow: none; }
.card.done .nm, .card.done .t b { color: var(--muted); }
.card.done .st { color: var(--done); }
.card.wait { border-left-color: var(--today); background: var(--today-soft); }
.card.wait .st { background: var(--today); color: #2a2000; }
.card.room { background: var(--primary); border-color: var(--primary-2); border-left-color: var(--primary-2); box-shadow: var(--shadow-lg); }
.card.room .t, .card.room .ty, .card.room .nm span, .card.room .t b, .card.room .nm { color: var(--on-primary); }
.card.room .st { background: rgba(255, 255, 255, .22); color: var(--on-primary); }
.card.noshow { border-left-color: var(--faint); background: var(--surface-2); box-shadow: none; }
.card.noshow .nm { text-decoration: line-through; color: var(--muted); }
.card.vac { border-radius: 8px; padding: 3px 9px; justify-content: center; }
.card.vac .nm { font-size: 13.5px; }
.shield { flex: none; vertical-align: -1px; }

/* Sağ panel (9'dan fikir) */
.rail { width: 290px; flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-height: 0; display: flex; flex-direction: column; }
.box h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.box h3 .c { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--today); }
.box > small { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.who { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.who .av { width: 34px; height: 34px; font-size: 13px; }
.who .av.w { background: var(--today); color: #2a2000; }
.who b { font-size: 14px; display: block; }
.who small { display: block; font-size: 12px; color: var(--muted); }
.who small.r { color: var(--primary); font-weight: 600; }
.who small.w { color: var(--today); font-weight: 600; }
.call { margin-top: 8px; height: 34px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 13px; display: grid; place-items: center; }
.slot { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
.slot b { font-size: 16px; }
.slot div { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }
.slot div small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.slot .plus { color: var(--primary); font-size: 20px; line-height: 1; }

/* Hafta (3'ten fikir: küçük kartlar, "+N daha", geçmiş soluk) */
.wk { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wd { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.wd:first-child { border-left: 0; }
.wd.today { background: color-mix(in srgb, var(--primary-soft) 50%, transparent); }
.wd.off { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--faint) 10%, transparent) 6px 8px); }
.wdh { padding: 8px 10px 6px; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.wdh .d { font-size: 20px; font-weight: 700; }
.wd.today .wdh .d { color: var(--primary); }
.wdh .dn { font-weight: 600; color: var(--muted); font-size: 13px; }
.wdh .c { margin-left: auto; font-size: 12px; color: var(--muted); }

const SH = '<svg class="shield" width="12" height="12" viewBox="0 0 16 16" aria-label="Aşı"><path d="M8 1.2 2.5 3.3v4.2c0 3.4 2.3 6.1 5.5 7.3 3.2-1.2 5.5-3.9 5.5-7.3V3.3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';

const clock = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

const ST_LABEL = { done: '✓', overdue: 'Gecikmiş', noshow: 'Gelmedi', wait: 'Bekliyor', room: 'Muayenede' };

let V = '1';
const route = () => { let h = (location.hash || '#1-gun').slice(1); const n = /@(\d)$/.exec(h); NV = n ? +n[1] : 2; h = h.replace(/@\d$/, ''); const m = /^([123])-(.+)$/.exec(h); V = m ? m[1] : '1'; return m ? m[2] : h || 'gun'; };
const VARIANTS = { 1: ['Klinik panosu', 'özet, hekim sütunları, sağ panel'], 2: ['Ferah kartlar', 'büyük kart, sade, panelsiz'], 3: ['Ajanda + takvim', 'solda ay ve bugünün listesi'] };
function draft(view) {

}

// ---- Gün ----
let PPM = 84 / 60; // saat başı 84 px: 30 dk = 42 px, iki satır rahat sığar
function card(it, h) {

  return `<aside class="rail">
    <div class="box"><h3>Klinikte <span class="c">2 hasta</span></h3><small>Kabulden canlı · 14:20</small>
      <div class="who"><span class="av w">MA</span><div><b>Minnoş · Zeynep Aras</b><small class="w">Bekliyor 8 dk · Dr. Ece Arslan</small><small>14:12'de geldi · Aşı randevusu</small></div></div>
      <div class="who"><span class="av">CG</span><div><b>Cesur · Ahmet Güneş</b><small class="r">Muayenede · Dr. Murat Kaya</small><small>14:02'den beri</small></div></div>
      <a class="call">Minnoş'u içeri al</a></div>
    <div class="box"><h3>Boş saatler</h3><small>Bugün öğleden sonra</small>
      <div class="slot"><b class="tnum">15:00</b><div>Dr. Ece Arslan<small>30 dk</small></div><span class="plus">+</span></div>
      <div class="slot"><b class="tnum">15:00</b><div>Dr. Murat Kaya<small>60 dk</small></div><span class="plus">+</span></div>
      <div class="slot"><b class="tnum">16:30</b><div>Dr. Ece Arslan<small>30 dk</small></div><span class="plus">+</span></div></div>
  </aside>`;
}

// ---- Seçenek 3: solda küçük ay ve bugünün listesi (randevu + aşı tek listede) ----
function agendaPanel() {
  const first = new Date(2026, 9, 26);
  let g = ['P', 'S', 'Ç', 'P', 'C', 'C', 'P'].map((x) => `<span class="w">${x}</span>`).join('');
  for (let i = 0; i < 42; i++) {
    const dt = new Date(first); dt.setDate(first.getDate() + i);
    const dn = dt.getDate(), out = dt.getMonth() !== 10;
    const cls = out ? 'o' : dn === 18 ? 't' : dn >= 16 && dn <= 22 ? 'wkd' : '';
    g += `<a class="${cls}">${dn}${!out && dn < 18 && (dn * 7) % 3 === 0 ? '<i></i>' : ''}</a>`;
  }
  const d = DAYS[2];
  const items = [...d.appts.map((x) => ({ s: x.s, st: x.st, pet: x.pet, sub: `${x.type.startsWith('Aşı') ? '' : x.type + ' · '}${short(x.owner)} · ${x.vet}${x.st === 'wait' ? ' · bekliyor ' + x.extra : x.st === 'room' ? ' · muayenede' : ''}`, vac: x.type.startsWith('Aşı') ? x.type.replace('Aşı · ', '') : null })),
    ...VAX.filter((x) => x.s !== null && x.s < H(18)).map((x) => ({ s: x.s, st: x.st, pet: x.pet, sub: short(x.owner), vac: x.vac }))].sort((p, q) => p.s - q.s);
  const open = items.filter((x) => x.st !== 'done');
  const done = items.length - open.length;
  let list = `<div class="ar done" style="grid-template-columns:1fr"><div class="x"><div>✓ ${done} iş tamamlandı ▸</div></div></div><div class="agrp">Saatsiz aşılar · 2</div>`;
  list += VAX.filter((x) => x.s === null).map((x) => `<div class="ar today"><b class="tm">—</b><div class="x"><div>${SH} ${x.pet} · ${x.vac}</div><small>${short(x.owner)}</small></div></div>`).join('');
  let nowDone = false;
  for (const x of open) {
    if (!nowDone && x.s > NOW) { list += `<div class="anow tnum">${clock(NOW)}</div>`; nowDone = true; }
    list += `<div class="ar ${x.st === 'wait' ? 'today' : x.st}"><b class="tm">${clock(x.s)}</b><div class="x"><div>${x.vac ? SH + ' ' : ''}${x.pet}${x.vac ? ' · ' + x.vac : ''}</div><small>${x.sub}</small></div></div>`;
  }
  return `<aside class="lrail"><div class="mcal"><div class="hd">Kasım 2026<span>‹ ›</span></div><div class="g">${g}</div></div>
    <div class="agenda"><h3>Bugün<small>10 randevu · 17 aşı</small></h3><div class="seg2"><a class="on">Hepsi</a><a>Randevu</a><a>Aşı</a></div><div class="alist">${list}</div></div></aside>`;
}

// ---- Hafta ----
function mini(it) {
  const st = it.st === 'wait' || it.st === 'room' ? ` · ${ST_LABEL[it.st]}` : it.st === 'overdue' ? ' · gecikmiş' : '';
  return `<div class="mini ${it.st === 'wait' ? 'today' : it.st}"><div class="t tnum"><b>${clock(it.s)}</b><span class="ty2">· ${it.type.startsWith('Aşı') ? SH + ' ' : ''}${it.type}${st}</span><span class="vet">${it.vet || '–'}</span></div><div class="nm">${it.pet} <span>· ${short(it.owner)}</span></div></div>`;
}
function renderWeek() {
  main.innerHTML = head('hafta') + `<div class="body">${V === '3' ? agendaPanel() : ''}<section class="cal">${calbar('hafta')}<div class="wk" id="w"></div></section></div>`;
  document.getElementById('w').innerHTML = DAYS.map((d) => {
    const items = [...d.appts].sort((p, q) => p.s - q.s);
    let list = `<a class="vsum">${SH}<b>${d.vx[0]} aşı</b>${d.vx[1] ? `<span class="od">· ${d.vx[1]} gecikmiş</span>` : ''}<span class="chev">›</span></a>`;
    let nowDone = !d.today;
    for (const it of items) { if (!nowDone && it.s > NOW) { list += `<div class="nowsep tnum">${clock(NOW)}</div>`; nowDone = true; } list += mini(it); }
    if (!items.length) list += `<div style="font-size:12px;color:var(--muted);padding:4px">${d.open ? 'Randevu yok' : 'Kapalı'}</div>`;
    return `<div class="wd ${d.today ? 'today' : ''} ${d.open ? '' : 'off'}"><div class="wdh"><span class="d">${d.num}</span><span class="dn">${d.name}</span><span class="c">${d.appts.length} rnd</span></div><div class="wlist">${list}</div></div>`;
  }).join('');
}

// ---- Ay ----
function renderMonth() {
  main.innerHTML = head('ay') + `<div class="body">${V === '3' ? agendaPanel() : ''}<section class="cal">${calbar('ay')}<div class="mwk">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map((x) => `<div>${x}</div>`).join('')}</div><div class="mg" id="mg"></div></section></div>`;
  const names = ['Zeytin', 'Tarçın', 'Pamuk', 'Boncuk', 'Limon', 'Maya', 'Fırtına', 'Şans', 'Bal', 'Reis', 'Karamel', 'Leo', 'Kuki', 'Cesur', 'Karabaş', 'Lokum', 'Mavi', 'Rocky', 'Tekir', 'Tarzan'];
  const types = ['Kontrol', 'Muayene', 'Aşı', 'Kontrol', 'Operasyon'];
  const first = new Date(2026, 9, 26);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const dt = new Date(first); dt.setDate(first.getDate() + i);
    const dn = dt.getDate(), mon = dt.getMonth(), dow = i % 7, out = mon !== 10;
    const past = mon < 10 || (mon === 10 && dn < 18);
    const wk = mon === 10 ? DAYS.find((x) => x.num === dn) : null;
    let ap, vx, od;
    if (wk) { ap = wk.appts.filter((x) => !['done', 'noshow'].includes(x.st)).map((x) => ({ s: x.s, pet: x.pet, type: x.type.split(' · ')[0], st: x.st === 'wait' || x.st === 'room' ? 'today' : x.st })); vx = wk.vx[0]; od = wk.vx[1] + wk.appts.filter((x) => x.st === 'overdue').length; var total = wk.appts.length; }
    else {
      const s = (dn * 7 + mon * 3) % 11; total = dow === 6 ? 0 : dow === 5 ? 2 : 3 + (s % 5); vx = dow === 6 ? 2 + (s % 3) : 6 + ((s * 5) % 12); od = past ? s % 3 : 0;
      ap = past ? Array.from({ length: od ? 1 : 0 }, () => ({ s: H(10, 30), pet: names[dn % 20], type: 'Kontrol', st: 'overdue' })) : Array.from({ length: total }, (_, k) => ({ s: H(9 + k, k % 2 ? 30 : 0), pet: names[(dn + k) % 20], type: types[(dn + k) % 5], st: 'up' }));
    }
    const shown = ap.slice(0, 2).map((x) => `<div class="chip ${x.st}"><b class="tnum">${clock(x.s)}</b><span>${x.pet} · ${x.type}</span></div>`).join('');
    const rest = ap.length - Math.min(2, ap.length);
    const done = past && !ap.length && total ? `<div class="chip done"><span>✓ hepsi tamamlandı</span></div>` : '';
    cells += `<div class="mc ${out ? 'out' : ''} ${mon === 10 && dn === 18 ? 'today' : ''}"><div class="mh"><span class="d">${dn}</span><small>${dow === 6 ? 'kapalı' : total + ' randevu'}</small></div>${shown}${done}
      <div class="mv">${SH} ${vx} aşı${od ? `<span class="od">· ${od} gecikmiş</span>` : ''}${rest > 0 ? `<a class="more" style="margin-left:auto">+${rest} randevu</a>` : ''}</div></div>`;
  }
  document.getElementById('mg').innerHTML = cells;
}

function render() { const v2 = route(); document.body.className = 'v' + V; if (v2 === 'hafta') renderWeek(); else if (v2 === 'ay') renderMonth(); else renderDay(); }
render();
addEventListener('hashchange', render);
</script>
</body>
</html>
