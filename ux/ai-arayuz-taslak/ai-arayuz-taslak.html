<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay zekâ arayüzü taslağı</title>
<!--
  Yapay zekâ özelliklerinin panel arayüzü (2026-11-19). Statik, tıklanır taslak; veriler uydurmadır.
  Sol alttaki çizgili "Taslak" panelinden bölüm, seçenek (A yan panel, B sayfa içi, C pencere) ve durum seçilir.
  Bölümler: G = hasta geçmişi özeti (AI-002), M = muayene notunu alanlara ayırma (AI-001),
  S = hasta sahibine açıklama (AI-003), T = taburcu / evde bakım talimatı (AI-004). M, S ve T ortak taslak → onay desenini (AI-009) kullanır.
  Adres: #G-A-sonuc, #M-B-taslak, #T-C-taslak …; sonuna -koyu eklenirse koyu tema açılır.
  Ölçü: 1536×730 CSS piksel (1920×1080 ekran, %125 ölçek). Renkler vetinity-preset.ts'ten (primary.600 #0c8079).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@8.0.2/primeicons.css">
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafc; --border: #e2e8f0; --line: #eef2f6;
  --text: #0f172a; --muted: #475569; --faint: #94a3b8;
  --primary: #0c8079; --primary-h: #0a655f; --primary-50: #eefcfb; --primary-100: #d3f4f0; --on-primary: #ffffff;
  --amber: #b45309; --amber-bg: #fef3c7; --amber-dot: #f59e0b;
  --green: #15803d; --green-bg: #dcfce7;
  --red: #b91c1c; --red-bg: #fee2e2;
  /* Yapay zekâ: yalnız "makineden geldi, henüz doğrulanmadı" işareti için. Eylem rengi her zaman ana renktir. */
  --ai: #6d4fc2; --ai-bg: #f5f2ff; --ai-border: #c9bbf5; --ai-hl: #ebe4ff;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05);
  --pop: 0 10px 30px rgba(15, 23, 42, .18);
  --side: -8px 0 24px rgba(15, 23, 42, .08);
}
html.dark {
  --bg: #09090b; --surface: #18181b; --surface-2: #1f1f23; --border: #3f3f46; --line: #27272a;
  --text: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
  --primary: #2dd4bf; --primary-h: #5eead4; --primary-50: #0d2b29; --primary-100: #123a37; --on-primary: #042f2e;
  --amber: #fcd34d; --amber-bg: #3a2c0b; --amber-dot: #f59e0b;
  --green: #86efac; --green-bg: #12301d;
  --red: #fca5a5; --red-bg: #3b1515;
  --ai: #c4b5fd; --ai-bg: #1e1830; --ai-border: #4c3f78; --ai-hl: #2c2348;
  --shadow: none; --pop: 0 10px 30px rgba(0, 0, 0, .6); --side: -8px 0 24px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; cursor: pointer; }
textarea, input { font: inherit; color: var(--text); }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.grow { flex: 1; }

/* ---------- Kabuk ---------- */
.top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.logo { width: 200px; font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 12px; }
.logo i { font-size: 18px; color: var(--muted); }
.logo b { color: var(--primary); }
.search { width: 190px; height: 34px; border: 1px solid var(--border); border-radius: 8px; color: var(--faint); padding: 7px 10px; font-size: 13px; margin-left: auto; }
.clinic { font-weight: 600; font-size: 14px; }
.top .ic { color: var(--muted); font-size: 17px; }
.shell { display: flex; height: calc(100% - 56px); }
.side { width: 240px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 10px 0; overflow: hidden; }
.side h6 { margin: 14px 20px 4px; font-size: 11.5px; letter-spacing: .8px; font-weight: 700; }
.side a { display: flex; align-items: center; gap: 10px; padding: 8px 20px; font-size: 14.5px; }
.side a i { width: 18px; }
.side a.on { background: var(--primary-50); color: var(--primary); font-weight: 600; }
main { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 24px 90px; transition: padding-right .15s; }
main.pushed { padding-right: 464px; }

/* ---------- Taslak paneli (ürünün parçası değil) ---------- */
.draft { position: fixed; left: 10px; bottom: 10px; width: 220px; z-index: 100; display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px dashed var(--primary); border-radius: 10px; background: var(--primary-50); font-size: 12px; box-shadow: var(--shadow); }
.draft .dh { display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: .6px; }
.draft a { display: block; padding: 3px 2px; font-size: 11px; letter-spacing: -.1px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.draft a.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.draft .row { display: grid; gap: 4px; }
.draft .r2 { grid-template-columns: 1fr 1fr; }
.draft .r3 { grid-template-columns: 1fr 1fr 1fr; }
.draft .lbl { color: var(--muted); font-size: 11px; margin-top: 2px; }
.draft .dnote { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.draft .lnk { border: 0; background: none; color: var(--primary); padding: 0 0 0 8px; font-weight: 600; font-size: 11.5px; }

/* ---------- Genel parçalar ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h5 { margin: 0; font-size: 16px; font-weight: 600; }
.ch { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.btn { height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.pri:hover { background: var(--primary-h); }
.btn.out { border-color: var(--primary); color: var(--primary); background: transparent; }
.btn.txt { border-color: transparent; background: transparent; color: var(--muted); }
.btn.txt:hover { color: var(--text); background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.xs { height: 26px; padding: 0 8px; font-size: 12.5px; border-radius: 5px; }
.btn.ico { width: 30px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--muted); border-radius: 50%; }
.btn.ico:hover { background: var(--surface-2); color: var(--text); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn .pi-sparkles { color: var(--ai); }
.btn.pri .pi-sparkles { color: inherit; }
.btn.aib.act { border-color: var(--ai-border); background: var(--ai-bg); }
.pl { color: var(--primary); font-weight: 600; }
.g12 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
main.pushed .g12 { grid-template-columns: minmax(0, 1fr); }
main.pushed .hrow { flex-wrap: wrap; }
main.pushed .hmain { flex-basis: calc(100% - 80px); }
main.pushed .hacts { width: 100%; justify-content: flex-start; padding-left: 74px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 200; background: #0f172a; color: #f8fafc; padding: 10px 16px; border-radius: 8px; font-size: 13.5px; transition: .2s; box-shadow: var(--pop); display: flex; gap: 10px; align-items: center; }
html.dark .toast { background: #f4f4f5; color: #18181b; }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- Hasta kartı ---------- */
.backl { display: inline-block; color: var(--primary); font-weight: 600; font-size: 13.5px; margin-bottom: 10px; }
.hrow { display: flex; gap: 18px; align-items: flex-start; }
.av { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-50); display: grid; place-items: center; font-size: 26px; flex: none; }
.hmain { flex: 1; min-width: 0; }
.hmain h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
.idl { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.own { margin: 10px 0 0; display: flex; gap: 22px; align-items: center; }
.own .ph i { font-size: 12px; margin-right: 5px; }
.badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.bdg { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 12px; }
.bdg.red { background: var(--red-bg); color: var(--red); }
.bdg.amber { background: var(--amber-bg); color: var(--amber); }
.bdg.green { background: var(--green-bg); color: var(--green); }
.bdg.gray { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.anote { margin: 6px 0 0; font-size: 13.5px; }
.hacts { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.aioff { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.aioff small { color: var(--muted); font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.kpis dt { font-size: 12.5px; color: var(--muted); }
.kpis dd { margin: 2px 0 0; font-weight: 600; font-size: 14px; }
.kpis dd span { font-weight: 400; }
.abar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.tiles > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.tiles dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
.tiles dd { margin: 4px 0 0; font-size: 13.5px; font-weight: 600; }
.tiles dd small { font-weight: 400; color: var(--muted); }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.todo li:last-child { border-bottom: 0; }
.todo i { margin-top: 3px; color: var(--muted); }
.todo small { display: block; color: var(--muted); font-size: 12.5px; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.fchips a { font-size: 12.5px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--border); font-weight: 600; color: var(--muted); }
.fchips a.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 92px 26px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: start; }
.tl li:last-child { border-bottom: 0; }
.tl .d { color: var(--muted); font-size: 12.5px; }
.tl .t { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-50); color: var(--primary); display: grid; place-items: center; font-size: 11px; }
.tl b { font-weight: 600; }
.tl small { display: block; color: var(--muted); }
.dl { margin: 0; }
.dl > div { padding: 7px 0; border-bottom: 1px solid var(--line); }
.dl > div:last-child { border-bottom: 0; }
.dl dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
.dl dd { margin: 2px 0 0; font-weight: 500; }

/* ---------- AI ortak dil ---------- */
.aic { color: var(--ai); }
.tag-ai { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .3px; padding: 1px 8px; border-radius: 10px; color: var(--ai); background: var(--ai-bg); border: 1px solid var(--ai-border); }
.tag-ai i { font-size: 10px; }
.chip-ai { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 9px; color: var(--ai); background: var(--ai-bg); vertical-align: 1px; margin-left: 6px; cursor: help; text-transform: none; letter-spacing: 0; }
.chip-ai i { font-size: 9.5px; }
.dstrip { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--ai-border); background: var(--ai-bg); font-size: 13px; }
.dstrip > i { color: var(--ai); margin-top: 2px; }
.dstrip b { display: block; font-size: 13.5px; }
.dstrip span { color: var(--muted); }
.cov { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.cov i { font-size: 11px; margin-right: 4px; }
.cov b { color: var(--text); font-weight: 600; }
.cnote { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.cnote i { margin-top: 2px; font-size: 12px; }
.cnote.warn { background: var(--amber-bg); border-color: transparent; color: var(--text); }
.cnote.warn i { color: var(--amber); }
.secs { display: flex; flex-direction: column; gap: 14px; }
.sec h6 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.sec h6 .n { font-weight: 600; color: var(--faint); }
.sec ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sec li { padding-left: 12px; border-left: 2px solid var(--line); font-size: 13.5px; }
.sec li .srcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.sec.alert li { border-left-color: var(--red); }
.sec.alert h6 { color: var(--red); }
.src { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--primary); font-weight: 600; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); }
.src:hover { border-color: var(--primary); }
.src i { font-size: 10.5px; }
.src.od { color: var(--amber); }
.skel { display: flex; flex-direction: column; gap: 10px; }
.skel i { display: block; height: 11px; border-radius: 6px; background: linear-gradient(90deg, var(--line), var(--surface-2), var(--line)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: 0 0; } }
.loadh { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.loadh .pi-spinner { color: var(--ai); }
.aimsg { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 6px 2px; }
.aimsg .mi { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.aimsg.warn .mi { background: var(--amber-bg); color: var(--amber); }
.aimsg b { display: block; font-size: 14.5px; margin-top: 1px; }
.aimsg p { margin: 3px 0 10px; color: var(--muted); font-size: 13px; }

/* A · Yan panel */
.apanel { position: fixed; top: 56px; right: 0; bottom: 0; width: 440px; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--side); z-index: 30; display: flex; flex-direction: column; }
.ap-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.ap-h h4 { margin: 0; font-size: 16px; font-weight: 600; }
.ap-h .btn.ico { margin-left: auto; }
.ap-b { flex: 1; overflow-y: auto; padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.ap-f { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--line); }
.ap-f .grow { font-size: 12px; color: var(--muted); }

/* B · Sayfa içi kart */
.aicard { border: 1px dashed var(--ai-border); margin-top: 16px; }
.aicard .ch { margin-bottom: 10px; }
.aicard .cols { columns: 2; column-gap: 28px; }
.aicard .cols .sec { break-inside: avoid; margin-bottom: 14px; }
.aicard .head2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }

/* C · Pencere */
.mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 40; display: grid; place-items: center; }
.dlg { width: 920px; max-width: 95vw; height: calc(100vh - 60px); max-height: 660px; background: var(--surface); border-radius: 12px; box-shadow: var(--pop); display: flex; flex-direction: column; overflow: hidden; }
.dlg.fit { height: auto; }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px 10px; }
.dlg-h h3 { margin: 0; font-size: 17px; }
.dlg-h .btn.ico { margin-left: auto; }
.dlg-b { flex: 1; min-height: 0; padding: 0 20px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg-f { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px 14px; border-top: 1px solid var(--line); }
.dlg-f .grow { font-size: 12.5px; color: var(--muted); }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px 1fr; gap: 18px; }
.snav { display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); padding-right: 12px; overflow-y: auto; }
.snav a { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500; }
.snav a:hover { background: var(--surface-2); }
.snav a.on { background: var(--primary-50); color: var(--primary); font-weight: 600; }
.snav a.alert { color: var(--red); }
.snav a span { color: var(--faint); font-weight: 500; }
.snav .cov { flex-direction: column; margin-top: auto; padding: 10px; border-top: 1px solid var(--line); }
.scont { overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 16px; }
.split2 { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.split2 > div { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.colh { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.notebox { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.7; background: var(--surface-2); }
.notebox span[data-f] { border-radius: 3px; transition: background .1s; }
.notebox span.hl { background: var(--ai-hl); box-shadow: 0 0 0 2px var(--ai-hl); }
.srcbox { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; background: var(--surface-2); }
.srcbox b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-top: 8px; }
.srcbox b:first-child { margin-top: 0; }
.srcbox p { margin: 2px 0 0; }

/* Taslak alanları (AI-001 / AI-003 / AI-004) */
.dfld { display: flex; flex-direction: column; gap: 4px; }
.dfld .dl1 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.dfld .dl1 .edt { display: none; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.dfld.ed .dl1 .edt { display: inline; }
.dfld.hl .dta { box-shadow: 0 0 0 2px var(--ai-hl); }
.dta { width: 100%; border: 1px dashed var(--ai-border); background: var(--ai-bg); border-radius: 8px; padding: 8px 10px; resize: vertical; font-size: 13.5px; line-height: 1.5; }
.dta:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-style: solid; background: var(--surface); }
.dfld.ed .dta { border-style: solid; border-color: var(--border); background: var(--surface); }
.dfld.empty { flex-direction: row; justify-content: space-between; font-size: 13px; padding: 7px 10px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); }
.dfld.empty b { color: var(--text); font-weight: 600; }
.vit4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.vit4 label { font-size: 11.5px; color: var(--muted); display: block; }
.vit4 input { width: 100%; height: 32px; border: 1px dashed var(--ai-border); background: var(--ai-bg); border-radius: 6px; padding: 0 8px; }
.cfl { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg2 { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; padding: 2px; gap: 2px; background: var(--surface); }
.seg2 a { padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg2 a.on { background: var(--primary); color: var(--on-primary); }
.hintl { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.hintl i { margin-top: 2px; font-size: 12px; }

  return `<p class="saved">${esc(t.draft.replace('günde 1 kez, 3 gün.', 'günde 1 kez, 3 gün; 20 Kas sabahından başlayarak.'))}</p><div class="meta">${chipAi(true, 'Dr. Ayşe Kaya 19 Kas 14:41')}<span>Dr. Ayşe Kaya · 19 Kas 14:41</span></div>`;
}
function textCard(sec) {
  // S: muayene özeti yan sütunundaki kart. T'de bakım talimatları kartı hospDetail içinde.
  const t = TXT.S, o = S.opt, sc = S.scn;
  let body;
  if (sc === 'iz') body = `${textSaved('S')}<div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm"><i class="pi pi-copy"></i>Kopyala</button><button class="btn sm"><i class="pi pi-print"></i>Yazdır</button><button class="btn sm txt"><i class="pi pi-pencil"></i>Düzenle</button></div>`;
  else if (o === 'B' && (sc === 'taslak' || sc === 'yuk')) body = `<div style="display:flex;flex-direction:column;gap:10px">${textDraftBody('S', true)}<div style="display:flex;gap:6px;align-items:center">${textFoot('S')}</div></div>`;
  else body = `<p class="emptyt">${t.empty}</p><button class="btn sm aib ${o !== 'B' && sc !== 'once' ? 'act' : ''}" data-act="t-start"><i class="pi pi-sparkles"></i>${t.btn}</button>`;
  return `<section class="card" ${o === 'B' && sc === 'taslak' ? 'style="border:1px dashed var(--ai-border)"' : ''}><div class="ch"><h5>Hasta sahibine açıklama</h5>${o === 'B' && sc === 'taslak' ? tagAi() : ''}</div>${body}</section>`;
}
function hospDetail() {
  const o = S.opt, sc = S.scn;
  const rows = `<div class="irow"><p class="saved">Yatış boyunca kafes içinde dinlendirin; kafes 3'teki battaniyesi sahibine iade edildi.</p><div class="meta">Dr. Murat Er · 17 Kas 10:05</div></div>`;
  let list;
  if (sc === 'iz') list = `<div class="irow">${textSaved('T')}</div>${rows}`;
  else if (o === 'B' && (sc === 'taslak' || sc === 'yuk')) list = `<div class="irow draft-row"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><i class="pi pi-sparkles aic"></i><b style="font-size:13.5px">Yeni talimat</b>${tagAi()}</div><div style="display:flex;flex-direction:column;gap:10px">${textDraftBody('T', true)}<div style="display:flex;gap:6px;align-items:center">${textFoot('T')}</div></div></div>${rows}`;
  else list = rows;
  const aiActive = o !== 'B' && (sc === 'taslak' || sc === 'yuk');
  return `
  <div class="pgh"><div><h1>Yatış</h1><p>Duman · 17 Kas 2026 09:10'dan beri · Kafes 3</p></div><div class="acts"><button class="btn"><i class="pi pi-pencil"></i>Düzenle</button><button class="btn pri"><i class="pi pi-sign-out"></i>Taburcu et</button></div></div>
  <section class="card pstrip"><div class="av">🐈</div><div><b>Duman</b> <span class="muted">· Kedi · Tekir · Dişi (kısır) · 4 yaş · 3,9 kg</span><div class="muted" style="font-size:13px">Okan Tunç · Neden: kusma ve iştahsızlık</div></div><span class="grow"></span><span class="bdg amber">Yatışta · 2 gün 6 saat</span></section>
  <div class="wgrid">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="card"><div class="ch"><h5>Bakım talimatları</h5><span class="grow"></span><button class="btn sm aib ${aiActive ? 'act' : ''}" data-act="t-start"><i class="pi pi-sparkles"></i>Taslak hazırla</button><button class="btn sm pri"><i class="pi pi-plus"></i>Talimat ekle</button></div>
        <p class="muted" style="font-size:13px;margin:-4px 0 10px">Hasta sahibine verilecek taburcu / evde bakım talimatları; yatış notundan ayrıdır.</p>${list}</section>
      <section class="card"><div class="ch"><h5>Yatış notları</h5></div><ul class="nlist">
        <li>Kusma yok, 24 saattir sıvı alıyor. Az ve sık beslemeye geçilecek. Taburcu sonrası kusma tekrarlar ya da 24 saat yemezse başvuru.<small>19 Kas 08:30 · Dr. Murat Er</small></li>
        <li>Sıvı tedavisi sürüyor, bir kez kusma.<small>18 Kas 09:00 · Dr. Murat Er</small></li>
        <li>Yatış: 2 gündür kusma, iştahsızlık. Dehidrasyon %6.<small>17 Kas 09:10 · Dr. Murat Er</small></li></ul></section>
    </div>
    <aside style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="card"><div class="ch"><h5>Reçete ve uygulamalar</h5></div><ul class="nlist"><li>Maropitant 8 mg tablet · günde 1, 3 gün<small>Reçete 19 Kas</small></li><li>Ringer laktat IV<small>17–19 Kas</small></li></ul></section>
      <section class="card"><div class="ch"><h5>Kontrol</h5></div><ul class="nlist"><li>22 Kas 2026 11:00<small>Randevu · Dr. Murat Er</small></li></ul></section>
    </aside>
  </div>`;
}
function textOverlay() {
  const sec = S.sec, t = TXT[sec];
  if (!(S.scn === 'taslak' || S.scn === 'yuk')) return '';
  if (S.opt === 'A') return panel(sec === 'S' ? 'Hasta sahibine açıklama' : 'Bakım talimatı', textDraftBody(sec), textFoot(sec));
  if (S.opt === 'C') {
    const left = `<div class="colh">Kaynak kayıtlar</div><div class="srcbox">${t.src.map(s => `<b>${s[0]}</b><p>${esc(s[1])}</p>`).join('')}</div>`;
    return modal(sec === 'S' ? 'Hasta sahibine açıklama' : 'Bakım talimatı', `<div class="split2"><div>${left}</div><div>${textDraftBody(sec)}</div></div>`, textFoot(sec), 'fit');
  }
  return '';
}

/* ================= Çizim ================= */
const $ = s => document.querySelector(s);
function render() {
  document.documentElement.classList.toggle('dark', S.dark);
  const navKey = S.sec === 'G' ? 'pets' : 'records';
  document.querySelectorAll('.side a').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
  let page = '', ov = '';
  if (S.sec === 'G') { page = petPage(); ov = gOverlay(); }
  else if (S.sec === 'M') { page = S.scn === 'iz' ? examDetail() : examForm(); ov = mOverlay(); }
  else if (S.sec === 'S') { page = examDetail(); ov = textOverlay(); }
  else { page = hospDetail(); ov = textOverlay(); }
  const main = $('#main');
  const st = main.scrollTop;
  main.innerHTML = page;
  main.classList.toggle('pushed', S.opt === 'A' && ov.includes('apanel'));
  $('#overlay').innerHTML = ov;
  main.scrollTop = st;
  drawDraft();
  history.replaceState(null, '', `#${S.sec}-${S.opt}-${S.scn}${S.dark ? '-koyu' : ''}`);
}
const NOTES = {
  kapali: 'Yapılandırılmamış, klinikte kapalı ya da kullanıcının Ai.Use izni yok: düğme hiç görünmez.',
  kota: 'Klinik kotası ya da sistem bütçesi doldu: düğme soluk ve nedeni altında yazar.',
  once: 'Düğmeye basınca yükleniyor, sonra özet gelir.'
};
function drawDraft() {
  const sec = SECS[S.sec];
  $('#draft').innerHTML = `<div class="dh"><b>TASLAK · ${sec.code}</b><span><button class="lnk" data-act="dark">${S.dark ? 'Açık' : 'Koyu'}</button><button class="lnk" data-act="reset">Sıfırla</button></span></div>
  <div class="row r2">${Object.keys(SECS).map(k => `<a data-sec="${k}" class="${S.sec === k ? 'on' : ''}">${SECS[k].name}</a>`).join('')}</div>
  <div class="lbl">Seçenek</div><div class="row r3">${Object.keys(OPTS).map(k => `<a data-opt="${k}" class="${S.opt === k ? 'on' : ''}" title="${OPTS[k]}">${k} · ${OPTS[k].split(' ')[0]}</a>`).join('')}</div>
  <div class="lbl">Durum</div><div class="row r3">${sec.scns.map(s => `<a data-scn="${s[0]}" class="${S.scn === s[0] ? 'on' : ''}" title="${s[1]}">${s[1]}</a>`).join('')}</div>
  ${S.sec === 'G' && NOTES[S.scn] ? `<div class="dnote">${NOTES[S.scn]}</div>` : ''}`;
}
let tt;
function toast(t) { const el = $('#toast'); el.innerHTML = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2600); }
function later(scn, ms = 1300) { const from = S.scn; setTimeout(() => { if (S.scn === 'yuk') { S.scn = scn; render(); } }, ms); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-sec],[data-opt],[data-scn],[data-src],[data-merge],[data-fk],[data-cnav]');
  if (!t || t.disabled) return;
  if (t.dataset.sec) { S.sec = t.dataset.sec; S.scn = S.sec === 'G' ? 'sonuc' : 'taslak'; S.mB = {}; S.copen = true; return render(); }
  if (t.dataset.opt) { S.opt = t.dataset.opt; S.copen = true; return render(); }
  if (t.dataset.scn) { S.scn = t.dataset.scn; S.mB = {}; S.copen = true; return render(); }
  if (t.dataset.src) return toast(`<i class="pi pi-external-link"></i>Kayıt açılır: ${t.dataset.src}`);
  if (t.dataset.merge) { S.merge = t.dataset.merge; return render(); }
  if (t.dataset.cnav) { S.cnav = t.dataset.cnav; document.querySelectorAll('.snav a').forEach(a => a.classList.toggle('on', a === t)); const el = document.getElementById('sec-' + S.cnav); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  if (t.dataset.fk) {
    const [k, v] = t.dataset.fk.split(':'); S.mB[k] = v;
    if (KEYS.every(x => S.mB[x])) { toast(v === 'no' ? 'Öneri atıldı.' : 'Tüm öneriler işlendi. Muayeneyi kaydedince kayda geçer.'); }
    return render();
  }
  switch (t.dataset.act) {
    case 'dark': S.dark = !S.dark; return render();
    case 'reset': S.scn = START[S.sec]; S.mB = {}; S.merge = 'append'; S.copen = false; return render();
    case 'close': if (S.sec === 'G') S.scn = 'once'; else if (S.sec === 'M') { S.scn = 'yaz'; S.copen = false; } else S.scn = 'once'; return render();
    case 'g-start': S.scn = 'yuk'; render(); return later('sonuc');
    case 'g-close': S.scn = 'once'; return render();
    case 'copy': return toast('<i class="pi pi-copy"></i>Özet panoya kopyalandı (kaynak tarihleriyle).');
    case 'm-open': S.copen = true; if (S.scn === 'aktarildi') S.scn = 'yaz'; return render();
    case 'm-close': S.copen = false; return render();
    case 'm-split': S.scn = 'yuk'; S.copen = true; render(); return later('taslak');
    case 'm-accept': S.scn = 'aktarildi'; S.copen = false; render(); return toast('<i class="pi pi-check"></i>Taslak forma aktarıldı. Muayeneyi kaydedince kayda geçer.');
    case 'm-discard': S.scn = 'yaz'; S.mB = {}; S.copen = false; render(); return toast('Taslak atıldı; form değişmedi.');
    case 'm-undo': S.scn = 'taslak'; S.copen = true; render(); return toast('Aktarım geri alındı; taslak yeniden açıldı.');
    case 'm-save': S.scn = 'iz'; render(); return toast('<i class="pi pi-check"></i>Muayene kaydedildi.');
    case 't-start': S.scn = 'yuk'; render(); return later('taslak');
    case 't-accept': S.scn = 'iz'; render(); return toast(`<i class="pi pi-check"></i>${TXT[S.sec].saved}`);
    case 't-discard': S.scn = 'once'; render(); return toast('Taslak atıldı; hiçbir şey kaydedilmedi.');
  }
});
document.addEventListener('input', e => { const f = e.target.closest('.dfld'); if (f) f.classList.add('ed'); });
document.addEventListener('mouseover', e => {
  const f = e.target.closest('.dfld[data-f]');
  if (!f || !document.querySelector('.notebox')) return;
  S.mhl = f.dataset.f;
  document.querySelectorAll('.notebox span').forEach(s => s.classList.toggle('hl', s.dataset.f === S.mhl));
  document.querySelectorAll('.dfld').forEach(d => d.classList.toggle('hl', d === f));
});

/* Adresten başla: #G-A-sonuc, #M-C-taslak-koyu … */
(function init() {
  const p = location.hash.slice(1).split('-');
  if (p[0] && SECS[p[0]]) S.sec = p[0];
  if (p[1] && OPTS[p[1]]) S.opt = p[1];
  if (p[2] && SECS[S.sec].scns.some(s => s[0] === p[2])) S.scn = p[2]; else S.scn = S.sec === 'G' ? 'sonuc' : 'taslak';
  S.dark = p.includes('koyu') || (!location.hash && matchMedia('(prefers-color-scheme: dark)').matches);
  S.copen = true;
  render();
})();
</script>
</body>
</html>
